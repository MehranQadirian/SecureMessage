
name: Build and Release SecureMessage

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: securemessage-release
  cancel-in-progress: false

jobs:
  version:
    name: Detect Application Version
    runs-on: ubuntu-24.04

    outputs:
      version: ${{ steps.detect.outputs.version }}
      release_exists: ${{ steps.detect.outputs.release_exists }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect version and check existing release
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION="$(python3 - <<'PY'
          import re
          from pathlib import Path

          source = Path("main.py").read_text(encoding="utf-8")

          match = re.search(
              r'^\s*APP_VERSION\s*=\s*["\']([^"\']+)["\']',
              source,
              re.MULTILINE
          )

          if not match:
              raise SystemExit("APP_VERSION was not found in main.py")

          version = match.group(1)

          if not re.fullmatch(r'\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?', version):
              raise SystemExit(f"Invalid application version: {version}")

          print(version)
          PY
          )"

          echo "Application version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists."
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Release v$VERSION does not exist."
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
          fi

  build-linux:
    name: Build Linux Packages
    needs: version
    if: needs.version.outputs.release_exists == 'false'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            dpkg-dev \
            rpm \
            rsync \
            wget \
            python3-gi \
            python3-gi-cairo \
            gir1.2-gtk-4.0 \
            gir1.2-adw-1 \
            libgtk-4-1 \
            libgtk-4-dev \
            pkg-config \
            libadwaita-1-0 \
            librsvg2-common \
            gir1.2-gstreamer-1.0 \
            gir1.2-gst-plugins-base-1.0 \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            python3-pip

      - name: Build DEB, RPM and AppImage
        run: |
          bash packaging/linux-build.sh all

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: securemessage-linux
          path: |
            dist/linux/*.deb
            dist/linux/*.rpm
            dist/linux/*.AppImage
          if-no-files-found: error
          retention-days: 7

  build-windows:
    name: Build Windows Installer
    needs: version
    if: needs.version.outputs.release_exists == 'false'
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2 UCRT64
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-pip
            mingw-w64-ucrt-x86_64-python-gobject
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-gobject-introspection
            mingw-w64-ucrt-x86_64-librsvg
            mingw-w64-ucrt-x86_64-gst-plugins-base
            mingw-w64-ucrt-x86_64-gst-plugins-good
            mingw-w64-ucrt-x86_64-python-pillow
            mingw-w64-ucrt-x86_64-python-numpy
            mingw-w64-ucrt-x86_64-python-cryptography
            mingw-w64-ucrt-x86_64-python-cffi
            mingw-w64-ucrt-x86_64-pyinstaller
            mingw-w64-ucrt-x86_64-python-argon2_cffi

      - name: Install additional Python dependencies
        shell: msys2 {0}
        run: |
          python -m pip install --upgrade kyber-py

      - name: Build Windows MSI
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          ./packaging/windows-build-installer.ps1 -SkipMsys2Setup

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: securemessage-windows
          path: dist/windows/*.msi
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs:
      - version
      - build-linux
      - build-windows

    if: needs.version.outputs.release_exists == 'false'
    runs-on: ubuntu-24.04

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: SecureMessage v${{ needs.version.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/*.msi
